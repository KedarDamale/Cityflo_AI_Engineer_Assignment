[project]
name = "cityflo-ai-engineer-assignment"
version = "0.1.0"
description = "MCP server for discoverable student Class 10 marks lookups"
readme = "README.md"
authors = [
    { name = "KedarDamale", email = "damalekedar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "duckdb>=1.5.5",
    "fastmcp>=4.1.4",
    "mcp>=2.3.0",
    "pydantic>=2",
    "rapidfuzz>=3.14.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
cityflo-ai-engineer-assignment = "cityflo_ai_engineer_assignment.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
